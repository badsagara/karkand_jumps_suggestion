<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Jump spots on Strike at Karkand — Battlefield 2">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Karkand Jump Map — editor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#13110D;
  --surface:#1B1813;
  --surface-2:#242019;
  --surface-3:#2E2920;
  --line:#3B3429;
  --line-soft:#2A251E;
  --ink:#F0E8D7;
  --ink-2:#A99C83;
  --ink-3:#776D5C;
  --amber:#E9A23B;
  --amber-deep:#9A6A1E;
  --brick:#C4553C;
  --d1:#8CA453; --d2:#B8AE47; --d3:#E9A23B; --d4:#DB7A38; --d5:#C4553C;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:3px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--amber-deep);color:#fff}

.lbl{
  font-family:Oswald,"IBM Plex Sans",sans-serif;
  font-weight:500;text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;color:var(--ink-3);
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-inline:20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1F1B15,#17140F);
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{
  font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;font-size:20px;margin:0;white-space:nowrap;
}
.brand h1 span{color:var(--amber)}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-family:Oswald,sans-serif}
.topbar .spacer{flex:1}
.stat{display:flex;gap:14px;align-items:baseline}
.stat b{font-family:Oswald,sans-serif;font-size:17px;font-weight:600;color:var(--ink)}
.stat i{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-family:Oswald,sans-serif}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface-2);
  padding:7px 12px;border-radius:var(--r);
  font-family:Oswald,sans-serif;font-size:12px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--surface-3);color:var(--ink);border-color:#4A4133}
.btn.on{background:var(--amber);border-color:var(--amber);color:#1A1509}
.btn.on:hover{background:#F2AE4C;color:#1A1509}
.btn.ghost{background:none}
.btn.danger:hover{border-color:var(--brick);color:#E88A73}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1509}
.btn.primary:hover{background:#F2AE4C;color:#1A1509}
.btn.sm{padding:4px 9px;font-size:11px}
.viewonly.warn{color:#E88A73;border-color:var(--brick)}
a.btn,a.btn:hover{text-decoration:none}
.viewonly{
  border:1px solid var(--line);border-radius:100px;padding:4px 12px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap;
}

.main{display:grid;grid-template-columns:minmax(0,1fr) 408px;min-height:0}

/* ---------- map ---------- */
.mapwrap{
  position:relative;min-width:0;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#1A1711 0%,#100E0A 100%);
  border-right:1px solid var(--line);
}
.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.viewport.grabbing{cursor:grabbing}
.viewport.placing{cursor:crosshair}
.canvas{position:absolute;top:0;left:0;width:100%;transform-origin:0 0;will-change:transform}
.canvas img{display:block;width:100%;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.placeholder{
  width:100%;aspect-ratio:4/3;max-width:100%;
  background:
    repeating-linear-gradient(0deg,transparent 0 47px,rgba(233,162,59,.07) 47px 48px),
    repeating-linear-gradient(90deg,transparent 0 47px,rgba(233,162,59,.07) 47px 48px),
    linear-gradient(160deg,#241F17,#191610);
  display:grid;place-content:center;text-align:center;gap:6px;
  border:1px dashed var(--line);
}
.placeholder .lbl{font-size:12px;color:var(--ink-3)}
.placeholder p{margin:0;max-width:34ch;color:var(--ink-3);font-size:12px;line-height:1.5}

/* Markers sit outside the zoomed canvas and are placed in screen pixels, so
   the numbers stay sharp however far the map is zoomed in. --pz lets them
   grow a little with the zoom instead of shrinking against the terrain. */
.pins{position:absolute;inset:0;pointer-events:none;--pz:1}
.pins > .anchor,.pins > .badge{pointer-events:auto}
.leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.leaders .casing{stroke:#0B0906;stroke-width:calc(3.5px * var(--pz));opacity:.8;stroke-linecap:round}
.leaders .lead{stroke:var(--ink-2);stroke-width:calc(1.25px * var(--pz));opacity:.95;stroke-linecap:round}
.leaders .lead.sel{stroke:var(--amber)}
.leaders .dim{opacity:.16}

.anchor{
  position:absolute;padding:0;border-radius:50%;transform:translate(-50%,-50%);
  width:calc(9px * var(--pz));height:calc(9px * var(--pz));
  background:var(--ink);
  box-shadow:0 0 0 calc(2px * var(--pz)) #0B0906,
             0 0 0 calc(3px * var(--pz)) rgba(240,232,215,.38);
}
.anchor::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.anchor.sel{
  background:var(--amber);
  box-shadow:0 0 0 calc(2px * var(--pz)) #0B0906,
             0 0 0 calc(4.5px * var(--pz)) rgba(233,162,59,.45);
}
.anchor.dim{opacity:.25}
.anchor.editable{cursor:move}

.badge{
  position:absolute;transform:translate(-50%,-50%);border:0;
  height:calc(20px * var(--pz));min-width:calc(20px * var(--pz));
  padding:0 calc(6px * var(--pz));border-radius:calc(10px * var(--pz));
  display:flex;align-items:center;justify-content:center;gap:calc(2px * var(--pz));
  font-family:Oswald,sans-serif;font-weight:600;line-height:1;
  font-size:calc(11.5px * var(--pz));color:#14110B;white-space:nowrap;
  box-shadow:0 0 0 calc(1.5px * var(--pz)) #0B0906,
             0 0 0 calc(3px * var(--pz)) rgba(240,232,215,.42),
             0 calc(2px * var(--pz)) calc(6px * var(--pz)) rgba(0,0,0,.6);
}
.badge sup{font-size:calc(9px * var(--pz));font-weight:500;opacity:.75;line-height:1}
.badge:hover{
  box-shadow:0 0 0 calc(1.5px * var(--pz)) #0B0906,
             0 0 0 calc(4px * var(--pz)) rgba(233,162,59,.55),
             0 calc(2px * var(--pz)) calc(6px * var(--pz)) rgba(0,0,0,.6);
  z-index:5;
}
.badge.sel{
  box-shadow:0 0 0 calc(2px * var(--pz)) #0B0906,
             0 0 0 calc(5px * var(--pz)) var(--amber),
             0 calc(2px * var(--pz)) calc(7px * var(--pz)) rgba(0,0,0,.7);
  z-index:6;
}
.badge.dim{opacity:.28}
.badge.editable{cursor:move}

.maptools{
  position:absolute;left:14px;bottom:14px;display:flex;gap:6px;
  background:rgba(19,17,13,.86);border:1px solid var(--line);
  border-radius:var(--r);padding:5px;backdrop-filter:blur(6px);
}
.maptools button{
  width:30px;height:28px;display:grid;place-items:center;border-radius:2px;
  color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:13px;
}
.maptools button:hover{background:var(--surface-3);color:var(--ink)}
.maptools .z{width:auto;padding:0 9px;font-size:11px;color:var(--ink-3);pointer-events:none}

.mapbanner{
  position:absolute;left:14px;right:14px;top:14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(233,162,59,.12);border:1px solid rgba(233,162,59,.45);
  color:#F2C079;border-radius:var(--r);padding:8px 12px;font-size:12px;
}
.mapbanner .lbl{color:var(--amber)}

.tip{
  position:fixed;z-index:40;pointer-events:none;
  background:#0D0B08;border:1px solid var(--line);border-radius:2px;
  padding:5px 9px;font-size:12px;color:var(--ink);white-space:nowrap;
  box-shadow:var(--shadow);
}

/* ---------- side ---------- */
.side{display:flex;flex-direction:column;min-width:0;background:var(--surface);max-height:calc(100dvh - 58px)}
.side-scroll{overflow-y:auto;flex:1;min-height:0}

.filters{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.search{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;color:var(--ink);font-size:13px;
}
.search::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{
  border:1px solid var(--line);border-radius:100px;padding:3px 10px;
  font-size:11px;letter-spacing:.04em;color:var(--ink-3);background:var(--surface-2);
  transition:color .12s,border-color .12s,background .12s;
}
.chip:hover{color:var(--ink-2)}
.chip.on{color:#1A1509;background:var(--amber);border-color:var(--amber);font-weight:600}

.list{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:start;
  padding:11px 16px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%;
  transition:background .12s;
}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--amber)}
.row .num{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:Oswald,sans-serif;font-size:12px;font-weight:600;color:#14110B;
}
.row .nm{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.row .meta{font-size:11px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.row .cnt{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;padding-top:5px;white-space:nowrap}

.empty{padding:26px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h2{font-family:Oswald,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.1em;margin:0;color:var(--ink)}
.empty ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:7px}
.empty ol b{color:var(--ink);font-weight:500}

/* ---------- detail ---------- */
.detail{padding:16px;display:flex;flex-direction:column;gap:14px}
.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.detail h2,.form h2{
  font-family:Oswald,sans-serif;font-weight:600;font-size:19px;line-height:1.2;margin:0;
  text-wrap:balance;overflow-wrap:anywhere;
}
.detail .coords{font-size:11px;color:var(--ink-3);margin-top:3px}

.jump{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface-2);overflow:hidden}
.jump.open{border-color:var(--line)}
.jhead{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;
  width:100%;text-align:left;padding:10px 12px;
}
.jhead:hover{background:var(--surface-3)}
.jhead .jn{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-family:Oswald,sans-serif;font-size:11px;font-weight:600;color:#14110B;
}
.jhead .jt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.jhead .js{font-size:11px;color:var(--ink-3);margin-top:1px}
.jhead .cv{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.jbody{padding:0 12px 13px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-soft)}
.jbody .lbl{display:block;margin-bottom:6px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fact{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 11px}
.fact .lbl{display:block;margin-bottom:3px}
.fact .v{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.03em}
.bars{display:flex;gap:3px;margin-top:4px}
.bars i{display:block;width:15px;height:6px;border-radius:1px;background:var(--line)}

.tech{
  white-space:pre-wrap;background:var(--bg);border-left:2px solid var(--amber-deep);
  padding:11px 13px;font-size:13px;line-height:1.65;color:var(--ink);
  border-radius:0 var(--r) var(--r) 0;overflow-wrap:anywhere;
}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:2px;padding:2px 7px;background:var(--bg)}

.vids{display:flex;flex-direction:column;gap:11px}
.vid{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--bg);overflow:hidden}
.vid-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 11px 7px}
.vid-title{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.vid-out{font-size:11px;white-space:nowrap;font-family:Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.stage{
  display:block;width:100%;aspect-ratio:16/9;max-width:100%;position:relative;cursor:pointer;
  background:linear-gradient(140deg,#221E17,#14120D);
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
}
.stage.live{cursor:default}
.stage .play{
  position:absolute;inset:0;display:grid;place-content:center;gap:7px;justify-items:center;
  color:var(--ink-2);font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.stage .play svg{width:38px;height:38px;opacity:.85}
.stage:hover .play{color:var(--amber)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .thumb{
  position:absolute;inset:0;width:100%;height:100%;max-width:100%;
  object-fit:cover;opacity:.5;transition:opacity .15s;
}
.stage:hover .thumb{opacity:.72}
.stage .play{text-shadow:0 1px 6px rgba(0,0,0,.85)}
.vid-note{margin:0;padding:8px 11px;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.fallback{padding:7px 11px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line-soft)}

/* ---------- form ---------- */
.form{display:flex;flex-direction:column;gap:13px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field input[type=text],.field textarea,.field select{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;font-size:13px;color:var(--ink);width:100%;
}
.field textarea{resize:vertical;min-height:112px;line-height:1.6;font-family:inherit}
.diffpick{display:flex;gap:5px}
.diffpick button{
  flex:1;border:1px solid var(--line);border-radius:var(--r);padding:7px 0;
  font-family:Oswald,sans-serif;font-size:13px;color:var(--ink-3);background:var(--surface-2);
}
.diffpick button.on{color:#14110B;font-weight:600}
.vrow{border:1px solid var(--line-soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:7px;background:var(--surface-2)}
.vrow .vhead{display:flex;justify-content:space-between;align-items:center}
.vrow input{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:12px;width:100%}
.vrow.bad{border-color:var(--brick)}
.vrow input.bad{border-color:var(--brick)}
.vrow .err{font-size:11px;color:#E88A73;line-height:1.45}
.formbar{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.hint{font-size:11px;color:var(--ink-3);line-height:1.5}
.sep{height:1px;background:var(--line-soft);margin:2px 0}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:#0D0B08;border:1px solid var(--line);border-left:3px solid var(--amber);
  padding:10px 16px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);
  max-width:min(90vw,420px);
}
.hidden{display:none!important}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .mapwrap{border-right:none;border-bottom:1px solid var(--line);height:56vh;min-height:320px}
  .side{max-height:none}
  .side-scroll{overflow:visible}
  .topbar{padding-inline:16px;gap:10px}
  .brand h1{font-size:17px}
}
@media (max-width:620px){
  .brand .sub{display:none}
  .topbar{padding-block:10px}
  .stat{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
<style>html,body{margin:0}img{max-width:100%}.hidden{display:none!important}</style>

<body>


<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Karkand <span>Jump</span> Map</h1>
      <span class="sub">Battlefield&nbsp;2 · Strike at Karkand</span>
    </div>
    <div class="spacer"></div>
    <div class="stat">
      <div><b id="statSpots">0</b> <i>spots</i></div>
      <div><b id="statJumps">0</b> <i>jumps</i></div>
      <div><b id="statVids">0</b> <i>clips</i></div>
    </div>
    <span class="viewonly lbl hidden" id="who" title="Signed in through Cloudflare Access"></span>
    <span class="viewonly lbl hidden" id="viewBadge" title="Only the map owner can change spots">View only</span>
    <a class="btn ghost hidden" id="btnIssues" target="_blank" rel="noopener noreferrer">Suggestions</a>
    <button class="btn primary" id="btnSave">Save to site</button>
    <button class="btn hidden" id="btnEdit">Edit</button>
    <button class="btn ghost hidden" id="btnMap">Map</button>
    <button class="btn ghost hidden" id="btnImport">Import</button>
    <button class="btn ghost" id="btnExport">Export</button>
  </header>

  <div class="main">
    <div class="mapwrap">
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas" style="--z:1">
          <div class="placeholder" id="placeholder">
            <span class="lbl">No minimap loaded</span>
            <p>Put map.png in this folder next to index.html, or hit Map to pick an image.</p>
          </div>
          <img id="mapimg" class="hidden" alt="Strike at Karkand minimap">
        </div>
        <div class="pins" id="pins">
          <svg class="leaders" id="leaders" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="mapbanner hidden" id="banner"></div>
      <div class="maptools">
        <button id="zOut" title="Zoom out">−</button>
        <span class="z mono" id="zLabel">100%</span>
        <button id="zIn" title="Zoom in">+</button>
        <button id="zFit" title="Fit to view">⤢</button>
      </div>
    </div>

    <aside class="side">
      <div class="filters">
        <input class="search" id="q" type="text" placeholder="Search name, technique, tag…" autocomplete="off">
        <div class="chips" id="catChips"></div>
        <div class="chips" id="diffChips"></div>
      </div>
      <div class="side-scroll" id="sideScroll">
        <div id="listPane"></div>
      </div>
    </aside>
  </div>
</div>

<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp" class="hidden">
<input type="file" id="jsonPick" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";

/* Jump type is a free-text field. These are only suggestions offered while
   typing, and the map below rewrites the ids used by earlier versions. */
var CAT_PRESETS = ["Bunny hop","C-jump","Partner boost","Dolphin dive","Vehicle boost","Ledge / ladder"];
var LEGACY_CATS = {
  bhop:"Bunny hop", cjump:"C-jump", boost:"Partner boost",
  dive:"Dolphin dive", veh:"Vehicle boost", ledge:"Ledge / ladder", other:""
};
var DIFF = ["","Easy","Fairly easy","Moderate","Hard","Very hard"];
var DCOL = ["","var(--d1)","var(--d2)","var(--d3)","var(--d4)","var(--d5)"];
var SVGNS = "http://www.w3.org/2000/svg";

var state = {
  spots: [], map: null, sel: null, edit: false,
  editing: null,          // {spot: spotId, jump: jumpId|null}
  openJump: null,
  q: "", cat: null, diff: null,
  db: null, assets: null, downloads: null,
  userMoved: false,
  canEdit: false, roleKnown: false, baseStamp: null
};
var z = 1, tx = 0, ty = 0;

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}
function uid(p){ return (p||"s") + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function catOf(j){
  var c = (j && j.cat || "").trim();
  if(Object.prototype.hasOwnProperty.call(LEGACY_CATS, c)) return LEGACY_CATS[c];
  return c;
}
function allCats(){
  var counts = {}, names = [];
  state.spots.forEach(function(s){
    (s.jumps||[]).forEach(function(j){
      var c = catOf(j);
      if(!c) return;
      if(counts[c] === undefined){ counts[c] = 0; names.push(c); }
      counts[c]++;
    });
  });
  names.sort(function(a,b){ return counts[b] - counts[a] || a.localeCompare(b); });
  return names.map(function(n){ return {name:n, count:counts[n]}; });
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function plural(n, one, many){ return n === 1 ? one : many; }
function toast(msg){
  var t = el("div","toast",msg);
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3600);
}
function ytId(url){
  if(!url) return null;
  var m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytStart(url){
  var m = String(url||"").match(/[?&](?:t|start)=(\d+h)?(\d+m)?(\d+)?s?/);
  if(!m) return 0;
  if(!m[1] && !m[2] && !m[3]){
    var n = String(url).match(/[?&](?:t|start)=(\d+)/);
    return n ? parseInt(n[1],10) : 0;
  }
  return (m[1]?parseInt(m[1],10):0)*3600 + (m[2]?parseInt(m[2],10):0)*60 + (m[3]?parseInt(m[3],10):0);
}
function driveId(url){
  var m = String(url||"").match(/drive\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=)([A-Za-z0-9_-]{10,})/);
  return m ? m[1] : null;
}
function isLink(url){ return /^https?:\/\//i.test(String(url||"").trim()); }
function sortSpots(a,b){
  return (a.createdAt||0) - (b.createdAt||0) || String(a.id).localeCompare(String(b.id));
}
function ordered(){ return state.spots.slice().sort(sortSpots); }
function getSpot(id){ return state.spots.filter(function(s){ return s.id === id; })[0]; }
function getJump(s, jid){ return (s && s.jumps || []).filter(function(j){ return j.id === jid; })[0]; }
function clipCount(s){
  return (s.jumps||[]).reduce(function(a,j){ return a + (j.videos||[]).length; }, 0);
}
function diffRange(s){
  var ds = (s.jumps||[]).map(function(j){ return j.diff || 3; });
  if(!ds.length) return [3,3];
  return [Math.min.apply(null, ds), Math.max.apply(null, ds)];
}
/* A spot is named by its own label when an older file carries one, otherwise
   by the first jump recorded there. */
function spotLabel(s){
  if(s && s.name) return s.name;
  var j = s && (s.jumps||[])[0];
  return (j && j.name) || "Unnamed spot";
}
function newJump(){
  return {id: uid("j"), name:"", route:"", cat:"", diff:3, kit:"", tech:"", tags:[], videos:[]};
}

/* Accepts both the current shape and the earlier one-jump-per-spot shape. */
function normalize(raw, id){
  var s = {
    id: id || raw.id || uid(),
    name: raw.name || "",
    x: typeof raw.x === "number" ? raw.x : 0.5,
    y: typeof raw.y === "number" ? raw.y : 0.5,
    ox: typeof raw.ox === "number" ? raw.ox : 0,
    oy: typeof raw.oy === "number" ? raw.oy : (raw.y > 0.14 ? -0.05 : 0.05),
    createdAt: raw.createdAt || 0,
    jumps: []
  };
  if(Array.isArray(raw.jumps) && raw.jumps.length){
    s.jumps = raw.jumps.map(function(j){
      return {
        id: j.id || uid("j"),
        name: j.name || "", route: j.route || "", cat: catOf(j),
        diff: j.diff || 3, kit: j.kit || "", tech: j.tech || "",
        tags: j.tags || [], videos: j.videos || []
      };
    });
  } else if(raw.tech || raw.route || (raw.videos && raw.videos.length) || raw.cat){
    s.jumps = [{
      id: uid("j"), name: raw.name || "", route: raw.route || "", cat: catOf(raw),
      diff: raw.diff || 3, kit: raw.kit || "", tech: raw.tech || "",
      tags: raw.tags || [], videos: raw.videos || []
    }];
  }
  return s;
}

/* ---------- storage ---------- */
var LS = "kjm.editor.v1";
var MAP_CANDIDATES = ["/map.png","/map.jpg","/map.jpeg","/map.webp"];
var READONLY = /(^|[?&])view(=1)?(&|$)/.test(location.search);

function saveLocal(){
  try{
    localStorage.setItem(LS, JSON.stringify({spots:state.spots, map:state.map, baseStamp:state.baseStamp}));
  }catch(e){
    toast("The browser refused to save. If you picked a map image by hand it is probably over the storage quota \u2014 put map.png next to index.html instead.");
  }
}
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && Array.isArray(d.spots)) state.spots = d.spots.map(function(s){ return normalize(s, s.id); });
    if(d && d.map) state.map = d.map;
    if(d && d.baseStamp) state.baseStamp = d.baseStamp;
  }catch(e){}
}
function persistSpot(){ saveLocal(); }
function dropSpot(){ saveLocal(); }
function persistMap(){ saveLocal(); }

function adopt(data, stamp){
  state.spots = (data.spots||[]).map(function(s){ return normalize(s, s.id); });
  if(data.mapFile) state.map = {src: data.mapFile};
  state.baseStamp = stamp || null;
  saveLocal();
}
function exportData(){
  return {
    game: "Battlefield 2",
    map: "Strike at Karkand",
    exported: new Date().toISOString(),
    mapFile: state.map && state.map.src ? state.map.src.replace(/^\//, "") : null,
    spots: ordered()
  };
}
function mapUrl(name){
  if(/^(data:|https?:)/i.test(name)) return name;
  try{ return new URL(name, document.baseURI).href; }catch(e){ return name; }
}
function mapMissing(tried){
  var ph = $("placeholder");
  if(!ph) return;
  var lbl = ph.querySelector(".lbl"), p = ph.querySelector("p");
  if(lbl) lbl.textContent = "Minimap not found";
  if(p) p.textContent = "Nothing answered at " + (tried || "map.png") +
    ". Put map.png in the same folder as index.html" +
    (state.canEdit ? ", or hit Map to pick a file." : ".");
}
function setMapSrc(src){
  var img = $("mapimg");
  if(img.getAttribute("src") === src) return;
  img.onload = function(){ fit(); render(); };
  img.onerror = function(){
    img.removeAttribute("src");
    state.map = null;
    saveLocal();
    mapMissing(src);
    render();
  };
  img.src = src;
}
function resolveMap(){
  if(state.map && state.map.data){ setMapSrc(state.map.data); render(); return; }
  var list = MAP_CANDIDATES.slice();
  if(state.map && state.map.src && list.indexOf(state.map.src) === -1) list.unshift(state.map.src);
  var i = 0;
  (function probe(){
    if(i >= list.length){
      state.map = null;
      mapMissing(mapUrl(MAP_CANDIDATES[0]));
      render();
      return;
    }
    var name = list[i++], url = mapUrl(name);
    var test = new Image();
    test.onload = function(){
      state.map = {src: name};
      saveLocal();
      setMapSrc(url);
      render();
    };
    test.onerror = probe;
    test.src = url;
  })();
}

/* ---------- map transform ---------- */
var viewport = $("viewport"), canvas = $("canvas");
function applyT(){
  canvas.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + z + ")";
  $("zLabel").textContent = Math.round(z*100) + "%";
  placeMarkers();
}
function fit(){
  measure();
  var vw = viewport.clientWidth, vh = viewport.clientHeight;
  var ch = baseH || vw * 0.75;
  if(!vw || !ch) return;
  z = clamp(Math.min(1, vh/ch), 0.2, 4);
  tx = (vw - vw*z)/2;
  ty = (vh - ch*z)/2;
  applyT();
}
function zoomAt(cx, cy, factor){
  var r = viewport.getBoundingClientRect();
  var px = cx - r.left, py = cy - r.top;
  var nz = clamp(z*factor, 0.2, 8), k = nz/z;
  tx = px - k*(px - tx);
  ty = py - k*(py - ty);
  z = nz; state.userMoved = true; applyT();
}
function centerPoint(){
  var r = viewport.getBoundingClientRect();
  return [r.left + viewport.clientWidth/2, r.top + viewport.clientHeight/2];
}
$("zIn").onclick  = function(){ var c = centerPoint(); zoomAt(c[0], c[1], 1.25); };
$("zOut").onclick = function(){ var c = centerPoint(); zoomAt(c[0], c[1], 0.8); };
$("zFit").onclick = fit;
viewport.addEventListener("wheel", function(e){
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89);
}, {passive:false});

var pan = null;
viewport.addEventListener("pointerdown", function(e){
  if(e.target.closest(".anchor") || e.target.closest(".badge")) return;
  pan = {x:e.clientX, y:e.clientY, tx:tx, ty:ty, moved:false};
  viewport.classList.add("grabbing");
  try{ viewport.setPointerCapture(e.pointerId); }catch(err){}
});
viewport.addEventListener("pointermove", function(e){
  if(!pan) return;
  var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3){ pan.moved = true; state.userMoved = true; }
  tx = pan.tx + dx; ty = pan.ty + dy; applyT();
});
viewport.addEventListener("pointerup", function(e){
  var was = pan;
  pan = null;
  viewport.classList.remove("grabbing");
  if(was && !was.moved && state.edit && !state.editing) addSpotAt(e.clientX, e.clientY);
});
viewport.addEventListener("pointercancel", function(){ pan = null; viewport.classList.remove("grabbing"); });

function targetBox(){
  return (state.map ? $("mapimg") : $("placeholder")).getBoundingClientRect();
}
function addSpotAt(cx, cy){
  var r = targetBox();
  var x = (cx - r.left) / r.width, y = (cy - r.top) / r.height;
  if(x < 0 || x > 1 || y < 0 || y > 1) return;
  var s = {
    id: uid(), name: "", x: x, y: y,
    ox: 0, oy: y > 0.14 ? -0.05 : 0.05,
    createdAt: Date.now(), jumps: [newJump()]
  };
  state.spots.push(s);
  state.sel = s.id;
  state.editing = {spot: s.id, jump: s.jumps[0].id};
  render();
  setTimeout(function(){ var n = $("f_name"); if(n) n.focus(); }, 30);
}

/* ---------- markers ---------- */
/* Anchors, badges and leaders live in the un-zoomed overlay and are placed in
   screen pixels from the canvas transform. Nothing here is ever rasterised at
   the map's scale, so the numbers stay crisp at 600%. */
var pins = $("pins"), leaders = $("leaders");
var baseW = 0, baseH = 0, markers = [];

function measure(){
  baseW = canvas.offsetWidth || viewport.clientWidth;
  baseH = canvas.offsetHeight || baseW * 0.75;
}
function pinScale(){
  return Math.min(1.8, Math.max(1, 1 + (z - 1) * 0.13));
}
function placeMarkers(){
  if(!baseW || !baseH) measure();
  pins.style.setProperty("--pz", pinScale());
  for(var i = 0; i < markers.length; i++){
    var m = markers[i], s = m.spot;
    var ax = tx + z * s.x * baseW,                  ay = ty + z * s.y * baseH;
    var bx = tx + z * (s.x + (s.ox||0)) * baseW,    by = ty + z * (s.y + (s.oy||0)) * baseH;
    m.dot.style.left   = ax + "px"; m.dot.style.top   = ay + "px";
    m.badge.style.left = bx + "px"; m.badge.style.top = by + "px";
    if(m.casing){
      m.casing.setAttribute("x1", ax); m.casing.setAttribute("y1", ay);
      m.casing.setAttribute("x2", bx); m.casing.setAttribute("y2", by);
      m.line.setAttribute("x1", ax);   m.line.setAttribute("y1", ay);
      m.line.setAttribute("x2", bx);   m.line.setAttribute("y2", by);
    }
  }
}

var tipEl = null;
function showTip(e, text){
  hideTip();
  tipEl = el("div","tip",text);
  document.body.appendChild(tipEl);
  moveTip(e);
}
function moveTip(e){
  if(!tipEl) return;
  tipEl.style.left = clamp(e.clientX + 12, 6, window.innerWidth - tipEl.offsetWidth - 6) + "px";
  tipEl.style.top = (e.clientY - 34) + "px";
}
function hideTip(){ if(tipEl){ tipEl.remove(); tipEl = null; } }

function dragHandle(node, spot, onMove){
  node.addEventListener("pointerdown", function(e){
    e.stopPropagation();
    if(!state.edit) return;
    var r = targetBox(), moved = false;
    try{ node.setPointerCapture(e.pointerId); }catch(err){}
    function mv(ev){
      moved = true;
      onMove(clamp((ev.clientX - r.left)/r.width, -0.2, 1.2),
             clamp((ev.clientY - r.top)/r.height, -0.2, 1.2));
      placeMarkers();
    }
    function up(){
      node.removeEventListener("pointermove", mv);
      node.removeEventListener("pointerup", up);
      if(moved) persistSpot(spot);
    }
    node.addEventListener("pointermove", mv);
    node.addEventListener("pointerup", up);
  });
}

function drawLeaders(){
  while(leaders.firstChild) leaders.removeChild(leaders.firstChild);
  markers.forEach(function(m){
    var casing = document.createElementNS(SVGNS, "line");
    var line   = document.createElementNS(SVGNS, "line");
    casing.setAttribute("class", "casing" + (m.dim ? " dim" : ""));
    line.setAttribute("class", "lead" + (m.sel ? " sel" : m.dim ? " dim" : ""));
    leaders.appendChild(casing);
    leaders.appendChild(line);
    m.casing = casing; m.line = line;
  });
}

function renderMarkers(){
  for(var n = pins.childNodes.length - 1; n >= 0; n--){
    if(pins.childNodes[n] !== leaders) pins.removeChild(pins.childNodes[n]);
  }
  markers = [];
  var visible = filtered().map(function(s){ return s.id; });

  ordered().forEach(function(s, i){
    var dim = visible.indexOf(s.id) === -1;
    var sel = state.sel === s.id;
    var range = diffRange(s);
    var color = DCOL[range[0]] || DCOL[3];
    var label = spotLabel(s) + " · " + (s.jumps||[]).length + " " + plural((s.jumps||[]).length, "jump", "jumps");

    var dot = el("button","anchor");
    dot.setAttribute("aria-label", label);
    if(dim) dot.classList.add("dim");
    if(sel) dot.classList.add("sel");
    if(state.edit) dot.classList.add("editable");
    dragHandle(dot, s, function(nx, ny){ s.x = clamp(nx, 0, 1); s.y = clamp(ny, 0, 1); });
    dot.addEventListener("click", function(e){ e.stopPropagation(); select(s.id); });
    dot.addEventListener("pointerenter", function(e){ showTip(e, label); });
    dot.addEventListener("pointermove", moveTip);
    dot.addEventListener("pointerleave", hideTip);
    pins.appendChild(dot);

    var badge = el("button","badge");
    badge.style.background = color;
    badge.appendChild(el("span", null, String(i+1)));
    if((s.jumps||[]).length > 1){
      var sup = document.createElement("sup");
      sup.textContent = "×" + s.jumps.length;
      badge.appendChild(sup);
    }
    if(dim) badge.classList.add("dim");
    if(sel) badge.classList.add("sel");
    if(state.edit) badge.classList.add("editable");
    dragHandle(badge, s, function(nx, ny){ s.ox = nx - s.x; s.oy = ny - s.y; });
    badge.addEventListener("click", function(e){ e.stopPropagation(); select(s.id); });
    badge.addEventListener("pointerenter", function(e){ showTip(e, label); });
    badge.addEventListener("pointermove", moveTip);
    badge.addEventListener("pointerleave", hideTip);
    pins.appendChild(badge);

    markers.push({spot: s, dot: dot, badge: badge, dim: dim, sel: sel});
  });

  drawLeaders();
  placeMarkers();
}

function select(id){
  hideTip();
  state.sel = id;
  state.editing = null;
  var s = getSpot(id);
  state.openJump = s && s.jumps && s.jumps.length ? s.jumps[0].id : null;
  render();
}

/* ---------- filtering ---------- */
function jumpMatches(j, q){
  if(state.cat && catOf(j) !== state.cat) return false;
  if(state.diff && j.diff !== state.diff) return false;
  if(!q) return true;
  var hay = [j.name, j.route, j.tech, j.kit, catOf(j), (j.tags||[]).join(" "),
    (j.videos||[]).map(function(v){ return (v.title||"") + " " + (v.note||""); }).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  return ordered().filter(function(s){
    if(q && (s.name||"").toLowerCase().indexOf(q) !== -1 && !state.cat && !state.diff) return true;
    if(!(s.jumps||[]).length) return !state.cat && !state.diff && !q;
    return s.jumps.some(function(j){ return jumpMatches(j, q); });
  });
}

/* ---------- chips + list ---------- */
function renderChips(){
  var cc = $("catChips"); cc.innerHTML = "";
  allCats().forEach(function(c){
    var b = el("button","chip" + (state.cat===c.name?" on":""), c.name + " " + c.count);
    b.onclick = function(){
      state.cat = state.cat===c.name ? null : c.name;
      state.sel = null; state.editing = null;
      render();
    };
    cc.appendChild(b);
  });
  cc.classList.toggle("hidden", !cc.children.length);
  var dc = $("diffChips"); dc.innerHTML = "";
  var lab = el("span","lbl","Difficulty");
  lab.style.marginRight = "4px";
  dc.appendChild(lab);
  for(var d=1; d<=5; d++){
    (function(d){
      var b = el("button","chip" + (state.diff===d?" on":""), String(d));
      if(state.diff===d){ b.style.background = DCOL[d]; b.style.borderColor = DCOL[d]; }
      b.onclick = function(){
        state.diff = state.diff===d ? null : d;
        state.sel = null; state.editing = null;
        render();
      };
      dc.appendChild(b);
    })(d);
  }
}

function renderList(){
  var pane = $("listPane");

  if(!state.spots.length && !state.canEdit){
    var v = el("div","empty");
    v.appendChild(el("h2", null, "Nothing mapped yet"));
    v.appendChild(el("div","hint","No jump spots have been published on this map so far. Check back later."));
    pane.appendChild(v);
    return;
  }

  if(!state.spots.length){
    var e = el("div","empty");
    e.appendChild(el("h2", null, "Getting started"));
    var ol = document.createElement("ol");
    [["Load the minimap.","Drop map.png into this folder next to index.html \u2014 the page finds it on its own. Or hit Map and pick a file by hand."],
     ["Drop a marker.","In Edit mode, click the map where the jump happens. Drag the dot to fine-tune the spot, drag the numbered badge to move the label clear of the terrain."],
     ["Describe it and attach clips.","Paste YouTube or Google Drive links — one spot holds as many jumps as you like, and each jump keeps its own technique, difficulty and clips."]]
    .forEach(function(p){
      var li = document.createElement("li");
      li.appendChild(el("b", null, p[0]));
      li.appendChild(document.createTextNode(" " + p[1]));
      ol.appendChild(li);
    });
    e.appendChild(ol);
    e.appendChild(el("div","hint","Opening index.html by double-click? Browsers block the page from reading jumps.json over file:// \u2014 use Import, or serve the folder with: python3 -m http.server"));
    pane.appendChild(e);
    return;
  }

  var order = ordered().map(function(s){ return s.id; });
  var rows = filtered();
  if(!rows.length){
    var n = el("div","empty");
    n.appendChild(el("h2", null, "Nothing matches"));
    var b = el("button","btn ghost","Clear filters");
    b.onclick = function(){ state.q=""; state.cat=null; state.diff=null; $("q").value=""; render(); };
    n.appendChild(b);
    pane.appendChild(n);
    return;
  }

  var list = el("div","list");
  rows.forEach(function(s){
    var r = el("button","row" + (state.sel===s.id ? " sel" : ""));
    var range = diffRange(s);
    var num = el("div","num", String(order.indexOf(s.id)+1));
    num.style.background = DCOL[range[0]] || DCOL[3];
    r.appendChild(num);

    var mid = el("div");
    mid.appendChild(el("div","nm", spotLabel(s)));
    var cats = [];
    (s.jumps||[]).forEach(function(j){
      var l = catOf(j);
      if(l && cats.indexOf(l) === -1) cats.push(l);
    });
    var meta = (s.jumps||[]).length + " " + plural((s.jumps||[]).length, "jump", "jumps");
    if(cats.length) meta += " · " + cats.slice(0,3).join(", ");
    meta += " · " + (range[0] === range[1] ? DIFF[range[0]] : DIFF[range[0]] + " → " + DIFF[range[1]]);
    mid.appendChild(el("div","meta", meta));
    r.appendChild(mid);

    r.appendChild(el("div","cnt", clipCount(s) + "▸"));
    r.onclick = function(){ select(s.id); };
    list.appendChild(r);
  });
  pane.appendChild(list);
}

/* ---------- detail ---------- */
function renderDetail(){
  var s = getSpot(state.sel);
  if(!s) return false;
  var pane = $("listPane");
  var order = ordered().map(function(x){ return x.id; });

  var d = el("div","detail");
  var top = el("div","detail-top");
  var h = el("div");
  h.appendChild(el("h2", null, (order.indexOf(s.id)+1) + ". " + spotLabel(s)));
  h.appendChild(el("div","coords mono", "X " + s.x.toFixed(3) + " · Y " + s.y.toFixed(3)));
  top.appendChild(h);
  var back = el("button","btn ghost","← All spots");
  back.onclick = function(){ state.sel = null; state.editing = null; render(); };
  top.appendChild(back);
  d.appendChild(top);

  var head = el("div");
  head.appendChild(el("span","lbl", (s.jumps||[]).length + " " + plural((s.jumps||[]).length, "jump here", "jumps here")));
  d.appendChild(head);

  var wrap = el("div");
  wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "9px";
  if(!(s.jumps||[]).length){
    wrap.appendChild(el("div","hint","No jumps recorded at this spot yet."));
  }
  (s.jumps||[]).forEach(function(j, i){ wrap.appendChild(jumpCard(s, j, i)); });

    add.onclick = function(){

      render();
      setTimeout(function(){ var n = $("f_name"); if(n) n.focus(); }, 30);
    };

    var delSpot = el("button","btn ghost danger","Delete spot");
    var armed = false;
    delSpot.onclick = function(){
      if(!armed){
        armed = true; delSpot.textContent = "Delete for good?"; delSpot.classList.add("on");
        setTimeout(function(){ armed = false; delSpot.textContent = "Delete spot"; delSpot.classList.remove("on"); }, 4000);
        return;
      }
      state.spots = state.spots.filter(function(x){ return x.id !== s.id; });

    d.appendChild(el("div","hint","Drag the dot to move the spot itself; drag the numbered badge to swing its label above or below the terrain."));
  }

  pane.appendChild(d);
  return true;
}

function jumpCard(s, j, i){

  var head = el("button","jhead");

  mid.appendChild(el("div","js", sub.join(" · ")));
  head.appendChild(mid);
  head.appendChild(el("div","cv", (open ? "▾ " : "▸ ") + (j.videos||[]).length));

  f2.appendChild(el("span","lbl","Difficulty"));

  var bars = el("div","bars");
  for(var k=1;k<=5;k++){

    bars.appendChild(b);
  }
  f2.appendChild(bars);
  facts.appendChild(f2);
  if(j.kit){
    var f3 = el("div","fact");
    f3.style.gridColumn = "1 / -1";
    f3.appendChild(el("span","lbl","Class / conditions"));
    f3.appendChild(el("div","v", j.kit));
    facts.appendChild(f3);
  }
  body.appendChild(facts);

  if(j.tech){
    var bt = el("div");
    bt.appendChild(el("span","lbl","Technique"));
    bt.appendChild(el("div","tech", j.tech));

  }

  if((j.tags||[]).length){
    var bg = el("div");
    bg.appendChild(el("span","lbl","Tags"));
    var tg = el("div","tags");
    j.tags.forEach(function(t){ tg.appendChild(el("span","tag", t)); });

  bv.appendChild(vs);

    ed.onclick = function(){ state.editing = {spot: s.id, jump: j.id}; render(); };
    bar.appendChild(ed);
    body.appendChild(bar);
  }

  card.appendChild(body);
  return card;
}

/* Clips are links only — YouTube or Google Drive. Nothing is hosted here. */
function embedFor(url){
  var yid = ytId(url);
  if(yid){
    var t = ytStart(url);
    return {
      kind: "YouTube",
      src: "https://www.youtube-nocookie.com/embed/" + yid + "?rel=0&modestbranding=1&autoplay=1" + (t ? "&start=" + t : ""),
      thumb: "https://i.ytimg.com/vi/" + yid + "/hqdefault.jpg"
    };
  }
  var did = driveId(url);
  if(did) return {kind: "Drive", src: "https://drive.google.com/file/d/" + did + "/preview"};
  return null;
}

function videoCard(v){
  var c = el("div","vid");
  var emb = embedFor(v.url);

  var head = el("div","vid-head");
  head.appendChild(el("span","vid-title", v.title || "Untitled clip"));
  if(isLink(v.url)){
    var a = el("a","vid-out", emb ? emb.kind + " ↗" : "Open ↗");
    a.href = v.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    head.appendChild(a);
  }
  c.appendChild(head);

  if(emb){
    var stage = el("div","stage");
    stage.setAttribute("role","button");
    stage.setAttribute("tabindex","0");
    stage.setAttribute("aria-label","Play clip");
    if(emb.thumb){
      /* Doubles as a live probe: where YouTube is blocked on the device the
         thumbnail never arrives either, so a bare stage is itself the hint. */
      var th = document.createElement("img");
      th.className = "thumb";
      th.alt = "";
      th.loading = "lazy";
      th.onerror = function(){ th.remove(); };
      th.src = emb.thumb;
      stage.appendChild(th);
    }
    var play = el("div","play");
    play.innerHTML = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2"/><path d="M20 16l13 8-13 8V16z" fill="currentColor"/></svg>';
    play.appendChild(el("span", null, "Watch"));
    stage.appendChild(play);
    stage.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); stage.onclick(); } };
    stage.onclick = function(){
      if(stage.classList.contains("live")) return;
      stage.classList.add("live");
      stage.removeAttribute("role");
      stage.removeAttribute("tabindex");
      var fr = document.createElement("iframe");
      fr.src = emb.src;
      fr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture";
      /* YouTube refuses to play (error 153) when the embedding page sends no
         Referer. Setting this explicitly overrides a stricter document-level
         policy; nothing can supply one over file://, which is why local
         double-click previews always fail. */
      fr.referrerPolicy = "strict-origin-when-cross-origin";
      fr.allowFullscreen = true;
      fr.title = v.title || emb.kind;
      stage.innerHTML = "";
      stage.appendChild(fr);

      var fb = el("div","fallback");
      fb.appendChild(document.createTextNode("Player not loading? "));
      var a2 = el("a", null, "Open on " + emb.kind + " ↗");
      a2.href = v.url; a2.target = "_blank"; a2.rel = "noopener noreferrer";
      fb.appendChild(a2);
      if(emb.kind === "Drive"){
        fb.appendChild(document.createTextNode(" Drive files play here only when sharing is set to “Anyone with the link”."));
      }
      c.insertBefore(fb, stage.nextSibling);
    };
    c.appendChild(stage);
    if(emb.kind === "YouTube" && location.protocol === "file:"){
      var warn = el("div","fallback");
      warn.appendChild(el("b", null, "Opened as a local file. "));
      warn.appendChild(document.createTextNode(
        "YouTube blocks embeds from file:// with error 153 — it needs a page address to work from. " +
        "Serve the folder over http (python3 -m http.server) or use the link above."));
      c.appendChild(warn);
    }
  } else if(!isLink(v.url)){
    c.appendChild(el("div","fallback","This clip has no link yet — paste a YouTube or Google Drive URL."));
  }

  if(v.note) c.appendChild(el("p","vid-note", v.note));
  return c;
}

/* ---------- jump form ---------- */
function renderForm(){
  var s = getSpot(state.editing.spot);
  var j = getJump(s, state.editing.jump);
  if(!s || !j) return false;
  var pane = $("listPane");
  var draft = {diff: j.diff};
  var f = el("div","form");

  var top = el("div","detail-top");
  top.appendChild(el("h2", null, j.name ? "Edit jump" : "New jump"));
  top.appendChild(el("span","lbl mono", "X " + s.x.toFixed(3) + " · Y " + s.y.toFixed(3)));
  f.appendChild(top);

  function field(label, node, hint){
    var w = el("div","field");
    w.appendChild(el("span","lbl", label));
    w.appendChild(node);
    if(hint) w.appendChild(el("div","hint", hint));
    return w;
  }
  function input(id, val, ph){
    var i = document.createElement("input");
    i.type = "text"; i.id = id; i.value = val || ""; i.placeholder = ph || "";
    return i;
  }

  var nm = input("f_name", j.name, "e.g. Square to Hotel roof, off the crates");
  f.appendChild(field("Jump name", nm, "Names the spot on the map when it is the first jump recorded here."));

  var known = CAT_PRESETS.slice();
  allCats().forEach(function(c){ if(known.indexOf(c.name) === -1) known.push(c.name); });
  var dl = document.createElement("datalist");
  dl.id = "catList";
  known.forEach(function(name){
    var o = document.createElement("option");
    o.value = name;
    dl.appendChild(o);
  });
  var cat = input("f_cat", catOf(j), "e.g. Bunny hop, C-jump, wall boost…");
  cat.setAttribute("list", "catList");
  cat.autocomplete = "off";
  var catField = field("Jump type", cat, "Free text — type your own or pick a suggestion. Matching names group into one filter.");
  catField.appendChild(dl);
  f.appendChild(catField);

  var dp = el("div","diffpick");
  for(var i=1;i<=5;i++){
    (function(i){
      var b = el("button", draft.diff===i ? "on" : "", String(i));
      if(draft.diff===i){ b.style.background = DCOL[i]; b.style.borderColor = DCOL[i]; }
      b.type = "button";
      b.onclick = function(){
        draft.diff = i;
        Array.prototype.forEach.call(dp.children, function(ch, idx){
          ch.className = (idx+1 === i) ? "on" : "";
          ch.style.background = (idx+1 === i) ? DCOL[i] : "";
          ch.style.borderColor = (idx+1 === i) ? DCOL[i] : "";
        });
      };
      dp.appendChild(b);
    })(i);
  }
  f.appendChild(field("Difficulty 1–5", dp));

  var ta = document.createElement("textarea");
  ta.id = "f_tech"; ta.value = j.tech || "";
  ta.placeholder = "1. Sprint in from the south entrance\n2. Crouch before the edge, jump onto the barrel\n3. C-jump to the ledge, crouch on landing";
  f.appendChild(field("Technique", ta));

  var tg = input("f_tags", (j.tags||[]).join(", "), "comma separated: solo, stamina, 64p");
  f.appendChild(field("Tags", tg));

  var vwrap = el("div","field");
  vwrap.appendChild(el("span","lbl","Clips"));
  var vlist = el("div");
  vlist.style.display = "flex"; vlist.style.flexDirection = "column"; vlist.style.gap = "8px";
  function addVideoRow(v){
    var row = el("div","vrow");
    var head = el("div","vhead");
    head.appendChild(el("span","lbl","Clip"));
    var rm = el("button","btn ghost danger sm","Remove");
    rm.type = "button";
    rm.onclick = function(){ row.remove(); };
    head.appendChild(rm);
    row.appendChild(head);
    [["title","Title, e.g. Third-person angle"],
     ["url","YouTube or Google Drive link"],
     ["note","Note: what this clip shows"]].forEach(function(spec){
      var inp = document.createElement("input");
      inp.type = "text"; inp.placeholder = spec[1];
      inp.value = (v && v[spec[0]]) || "";
      inp.dataset.k = spec[0];
      row.appendChild(inp);
    });
    vlist.appendChild(row);
  }
  (j.videos||[]).forEach(addVideoRow);
  vwrap.appendChild(vlist);
  var addv = el("button","btn ghost","+ Add clip");
  addv.type = "button"; addv.style.alignSelf = "flex-start";
  addv.onclick = function(){ addVideoRow(null); };
  vwrap.appendChild(addv);
  vwrap.appendChild(el("div","hint","Links only — nothing is uploaded here. Drive files play inline when their sharing is set to “Anyone with the link”."));
  f.appendChild(vwrap);

  var bar = el("div","formbar");
  var save = el("button","btn primary","Save");
  save.onclick = function(){
    var bad = false;
    Array.prototype.forEach.call(vlist.children, function(row){
      var u = row.querySelector('input[data-k="url"]');
      var old = row.querySelector(".err");
      if(old) old.remove();
      row.classList.remove("bad"); u.classList.remove("bad");
      var val = u.value.trim();
      if(!val || embedFor(val)) return;
      bad = true;
      row.classList.add("bad"); u.classList.add("bad");
      row.appendChild(el("div","err","Only YouTube and Google Drive links work here."));
    });
    if(bad){ toast("Check the highlighted links — YouTube or Google Drive only."); return; }

    /* Spot name, route and conditions are no longer edited here. Whatever an
       older jumps.json carried is left untouched and still displayed. */
    j.name = nm.value.trim();
    j.cat = cat.value.trim();
    j.diff = draft.diff;
    j.tech = ta.value;
    j.tags = tg.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
    j.videos = Array.prototype.map.call(vlist.children, function(row){
      var o = {};
      Array.prototype.forEach.call(row.querySelectorAll("input"), function(inp){ o[inp.dataset.k] = inp.value.trim(); });
      return o;
    }).filter(function(o){ return o.title || o.url; });
    persistSpot(s);
    state.editing = null;
    state.openJump = j.id;
    render();
  };
  bar.appendChild(save);

  var cancel = el("button","btn ghost","Cancel");
  cancel.onclick = function(){
    var blank = !j.name && !j.tech && !(j.videos||[]).length;
    if(blank){
      s.jumps = s.jumps.filter(function(x){ return x.id !== j.id; });
      if(!s.jumps.length && !s.name){
        state.spots = state.spots.filter(function(x){ return x.id !== s.id; });
        dropSpot(s.id);
        state.sel = null;
      } else {
        persistSpot(s);
      }
    }
    state.editing = null;
    render();
  };
  bar.appendChild(cancel);

  var del = el("button","btn ghost danger","Delete jump");
  var armed = false;
  del.onclick = function(){
    if(!armed){
      armed = true; del.textContent = "Delete for good?"; del.classList.add("on");
      setTimeout(function(){ armed = false; del.textContent = "Delete jump"; del.classList.remove("on"); }, 4000);
      return;
    }
    s.jumps = s.jumps.filter(function(x){ return x.id !== j.id; });
    persistSpot(s);
    state.editing = null;
    render();
  };
  bar.appendChild(del);
  f.appendChild(bar);

  pane.innerHTML = "";
  pane.appendChild(f);
  return true;
}

/* ---------- render ---------- */
var lastView = "";
function render(){
  var nS = state.spots.length;
  var nJ = state.spots.reduce(function(a,s){ return a + (s.jumps||[]).length; }, 0);
  var nV = state.spots.reduce(function(a,s){ return a + clipCount(s); }, 0);
  $("statSpots").textContent = nS;
  $("statJumps").textContent = nJ;
  $("statVids").textContent = nV;

  var vk = (state.sel || "-") + "|" + (state.editing ? state.editing.jump : "-");
  if(vk !== lastView){ lastView = vk; var sc = $("sideScroll"); if(sc) sc.scrollTop = 0; }

  $("mapimg").classList.toggle("hidden", !state.map);
  $("placeholder").classList.toggle("hidden", !!state.map);

  $("btnEdit").classList.toggle("hidden", !state.canEdit);
  $("btnMap").classList.toggle("hidden", !state.canEdit);
  $("btnImport").classList.toggle("hidden", !state.canEdit);
  $("viewBadge").classList.toggle("hidden", state.canEdit || !state.roleKnown);
  $("btnEdit").classList.toggle("on", state.edit);
  $("btnEdit").textContent = state.edit ? "Done" : "Edit";
  viewport.classList.toggle("placing", state.edit && !state.editing);

  var banner = $("banner");
  if(state.edit && !state.editing){
    banner.classList.remove("hidden");
    banner.innerHTML = "";
    banner.appendChild(el("span","lbl","Edit mode"));
    banner.appendChild(document.createTextNode("Click the map to drop a spot. Drag the dot to move it, drag the badge to reposition its label."));
  } else {
    banner.classList.add("hidden");
  }

  renderChips();
  $("listPane").innerHTML = "";
  if(state.editing && renderForm()){ renderMarkers(); return; }
  if(state.sel && renderDetail()){ renderMarkers(); return; }
  renderList();
  renderMarkers();
}

  box.appendChild(el("div", null, "Signed in, but ACCESS_AUD does not match this application. Its AUD tag is:"));

    "word-break:break-all;background:#0E0C09;border:1px solid var(--line);border-radius:2px;padding:7px 9px;color:var(--ink)";
  box.appendChild(code);

function saveToSite(){
  var btn = $("btnSave");
  if(btn.getAttribute("data-busy")) return;
  btn.setAttribute("data-busy", "1");
  btn.textContent = "Saving…";
  fetch("/api/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(exportData())
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){ return {status: r.status, body: d}; });
  }).then(function(res){
    if(res.status === 200 && res.body.ok){
      toast("Committed as " + (res.body.commit || "?") + ". The public site rebuilds in about a minute.");
    } else if(res.status === 401){
      toast("Your Cloudflare Access session expired. Reload the page and sign in again.");
    } else if(res.body.error === "not_configured"){
      toast("Saving is not set up yet: GITHUB_TOKEN and GITHUB_REPO are missing in the Pages settings.");
    } else {
      toast("Save failed (" + (res.body.error || res.status) + ")" +
            (res.body.detail ? ": " + String(res.body.detail).slice(0, 120) : "") +
            ". Use Export to keep a copy.");
    }
  }).catch(function(){
    toast("No answer from /api/save. Nothing was written — use Export to keep a copy.");
  }).then(function(){
    btn.removeAttribute("data-busy");
    btn.textContent = "Save to site";
  });
}
$("btnSave").onclick = saveToSite;

fetch("/api/save", {cache: "no-store"}).then(function(r){
  return r.json().catch(function(){ return {}; }).then(function(d){ return {status: r.status, body: d}; });
}).then(function(res){
  var w = $("who");
  if(res.status === 200){
    w.textContent = res.body.email || "signed in";
    w.classList.remove("hidden");
    if(res.body.repo){
      var gi = $("btnIssues");
      gi.href = "https://github.com/" + res.body.repo + "/issues?q=is%3Aissue+is%3Aopen+label%3Asuggestion";
      gi.classList.remove("hidden");
    }
    if(!res.body.configured){
      toast("Signed in, but saving is not configured: GITHUB_TOKEN and GITHUB_REPO are missing in the Pages settings.");
    }
  } else if(res.body.error === "aud_mismatch"){
    /* Signed in, but ACCESS_AUD does not match the token. Show the value the
       token actually carries — that is exactly what belongs in the variable,
       and it saves hunting for it in the Cloudflare dashboard. */
    w.textContent = "AUD not set";
    w.classList.add("warn");
    w.classList.remove("hidden");
    $("btnSave").classList.add("hidden");
    audNotice((res.body.tokenAud || [])[0] || "");
  } else {
    w.textContent = "not signed in";
    w.classList.add("warn");
    w.classList.remove("hidden");
    $("btnSave").classList.add("hidden");
  }
}).catch(function(){
  /* Opened outside Pages (a local copy): leave Save alone, it reports for itself. */
});

function setEditable(v){
  state.roleKnown = true;
  state.canEdit = v;
  if(!v){ state.edit = false; state.editing = null; }
  render();
}

/* ---------- boot ---------- */
loadLocal();
setEditable(!READONLY);
fit();
resolveMap();

fetch("/jumps.json", {cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error("missing");
  return r.json();
}).then(function(d){
  if(!d || !Array.isArray(d.spots)) return;
  var stamp = d.exported || "seed";
  if(state.baseStamp === stamp) return;
  var hadLocal = state.spots.length > 0;
  adopt(d, stamp);
  state.sel = null; state.editing = null;
  resolveMap();
  render();
  if(hadLocal) toast("Picked up a newer jumps.json.");
}).catch(function(){});
})();

</script>

</body>
</html>
